packages: []

# pnpm 11 reads `allowBuilds` here; `onlyBuiltDependencies` was removed in v11
# and is silently ignored, so a package that needs a postinstall gets none and
# fails at runtime rather than at install. Only packages actually in the
# lockfile belong here -- `@google/genai` and `protobufjs` had not been for
# some time (#228).
# `ffmpeg-static` fetches its binary in a postinstall, and the
# `@ffprobe-installer` platform packages ship theirs mode 644 and chmod it in
# one -- so without these entries install, build and deploy all go green and
# the first video generation fails on a binary that is missing or not
# executable (#499). Both Mac architectures and Railway's linux-x64 are listed;
# the others in that family are unused and would be noise.
allowBuilds:
  '@ffprobe-installer/darwin-arm64': true
  '@ffprobe-installer/darwin-x64': true
  '@ffprobe-installer/linux-x64': true
  esbuild: true
  ffmpeg-static: true
  sharp: true
  unrs-resolver: true

# pnpm 11 reads overrides from here, not package.json. This pins a vulnerable
# transitive dep to a patched version. The `protobufjs` and `shell-quote` pins
# that sat beside it named packages the lockfile does not contain.
overrides:
  minimatch: '>=10.2.1'
