packages: []

# pnpm 11+ (what Vercel runs, per the packageManager pin) reads `allowBuilds`.
# `onlyBuiltDependencies` was removed in v11 and is silently ignored there,
# which is what caused ERR_PNPM_IGNORED_BUILDS on deploy.
allowBuilds:
  '@google/genai': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# pnpm 11+ reads overrides from pnpm-workspace.yaml (not package.json).
# These pin vulnerable transitive deps to patched versions.
overrides:
  protobufjs: '>=7.5.5'
  shell-quote: '>=1.8.4'
  minimatch: '>=10.2.1'
