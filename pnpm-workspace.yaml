packages: []

# pnpm 11+ (what Vercel runs, per the packageManager pin) reads `allowBuilds`.
# `onlyBuiltDependencies` was removed in v11 and is silently ignored there,
# which is what caused ERR_PNPM_IGNORED_BUILDS on deploy.
allowBuilds:
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
