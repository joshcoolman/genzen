# Local runtime for genzen: Postgres + MinIO (S3-compatible storage) plus a
# one-shot bucket create.
#
#   pnpm local:up     start containers, migrate, and write .env.local
#   pnpm local:down   stop (data kept)
#   pnpm local:reset  stop and delete the volumes
#
# FAL is not mocked: image generation still calls fal.ai, so FAL_KEY is
# required even here.

name: genzen

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: genzen
      POSTGRES_PASSWORD: genzen
      POSTGRES_DB: genzen
    # 5434 on the host: 5432 is usually a system Postgres and 5433 is bootsy's.
    # A silent connection to the wrong database is the worst failure here, so
    # every stack gets its own port rather than sharing the default.
    ports:
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U genzen -d genzen']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: genzenlocal
      MINIO_ROOT_PASSWORD: genzenlocal
    # 9010/9011 rather than MinIO's default 9000/9001: ~/repos/bootsy uses the
    # defaults, and both stacks are often up at once. Shifting genzen means
    # neither has to be stopped to run the other.
    ports:
      - '9010:9000' # S3 API -- this is R2_ENDPOINT
      - '9011:9001' # web console, http://localhost:9011
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20

  # Runs once per `up`, creates the bucket if missing, then exits 0.
  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    # `anonymous set download` is the step bootsy doesn't need: genzen serves
    # plain public URLs (`${VITE_R2_PUBLIC_URL}/${key}`) rather than presigned
    # ones, so the browser fetches objects unauthenticated. Without it every
    # image 403s locally while the app itself looks fine.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 genzenlocal genzenlocal &&
      mc mb --ignore-existing local/genzen-images &&
      mc anonymous set download local/genzen-images &&
      echo 'bucket genzen-images ready (anonymous download)'
      "

volumes:
  minio-data:
  postgres-data:
