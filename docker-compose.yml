# Local runtime for genzen: Postgres + MinIO (S3-compatible storage) plus a
# one-shot bucket create.
#
#   pnpm local:up     start containers, migrate, and write .env.local
#   pnpm local:down   stop (data kept)
#   pnpm local:reset  stop and delete the volumes
#
# FAL is not mocked: image generation calls fal.ai for real, and costs real
# money. FAL_KEY is still optional — without one the app runs and only
# generation fails (see the PROVIDER_KEYS prompt in scripts/local-up.mjs).

name: genzen

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: genzen
      POSTGRES_PASSWORD: genzen
      POSTGRES_DB: genzen
    # 5434 on the host: 5432 is usually a system Postgres and 5433 is bootsy's.
    # A silent connection to the wrong database is the worst failure here, so
    # every stack gets its own port rather than sharing the default.
    ports:
      - '5434:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U genzen -d genzen']
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: genzenlocal
      MINIO_ROOT_PASSWORD: genzenlocal
    # 9010/9011 rather than MinIO's default 9000/9001: ~/repos/bootsy uses the
    # defaults, and both stacks are often up at once. Shifting genzen means
    # neither has to be stopped to run the other.
    ports:
      - '9010:9000' # S3 API -- this is R2_ENDPOINT
      - '9011:9001' # web console, http://localhost:9011
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 3s
      timeout: 3s
      retries: 20

  # Runs once per `up`, creates the bucket if missing, then exits 0.
  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    # The bucket is PRIVATE, and there is deliberately no `mc anonymous set
    # download` here any more (#226). The app serves its own images through
    # `/img/[id]`, which checks the session -- so nothing needs to read an
    # object without credentials, and local must not differ from a deployment
    # in exactly the dimension that changed. That step existing was how a
    # deploy-time surprise would have been built.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 genzenlocal genzenlocal &&
      mc mb --ignore-existing local/genzen-images &&
      echo 'bucket genzen-images ready (private)'
      "

volumes:
  minio-data:
  postgres-data:
